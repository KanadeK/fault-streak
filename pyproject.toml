[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fault-streak"
version = "0.1.0"
description = "Compare CPython faulthandler snapshots for persistent thread stacks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
fault-streak = "fault_streak.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/fault-streak"
Issues = "https://github.com/KanadeK/fault-streak/issues"

[tool.setuptools.packages.find]
include = ["fault_streak*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
